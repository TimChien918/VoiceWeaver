<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #video { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #status { position: fixed; top: 8px; left: 8px; color: #0ff; font-family: monospace;
              font-size: 12px; z-index: 100; pointer-events: none; }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <div id="status">初始化中...</div>

  <script>
    // 讀取 Kotlin 透過 URL 參數傳入的實體螢幕尺寸
    (function() {
      const p = new URLSearchParams(window.location.search);
      const w = parseInt(p.get('w')) || screen.width || 1080;
      const h = parseInt(p.get('h')) || screen.height || 1920;
      window.__screenW = w;
      window.__screenH = h;
    })();

    // 強制 eyegestures.js 從 assets 載入 WASM engine（不向外部 CDN 取）
    window.EyeGesturesEngineModuleUrl =
      'https://appassets.androidplatform.net/assets/EyegesturesEngine.js';
  </script>

  <!-- EyeGestures 本機拷貝（已加眨眼偵測 + 螢幕尺寸修正） -->
  <script src="https://appassets.androidplatform.net/assets/eyegestures.js"></script>

  <script>
    let tracker = null;

    function onGaze(point, calibrated) {
      const x = point[0] / window.__screenW;
      const y = point[1] / window.__screenH;
      if (window.AndroidBridge) {
        AndroidBridge.onGaze(
          Math.min(Math.max(x, 0), 1),
          Math.min(Math.max(y, 0), 1),
          calibrated ? 1 : 0
        );
      }
    }

    window.addEventListener('load', function() {
      try {
        tracker = new EyeGestures('video', onGaze);
        // 直接開始追蹤（跳過 EyeGestures 內建校準 UI）
        tracker.__run();
        // 隱藏 EyeGestures 內建游標（Kotlin GazeCursorOverlay 負責顯示）
        tracker.invisible();
        window._eyeTracker = tracker;
        if (window.AndroidBridge) AndroidBridge.onStatus('tracking');
      } catch(e) {
        console.error('EyeGestures init error:', e);
        if (window.AndroidBridge) AndroidBridge.onError(e.message || String(e));
      }
    });

    // Kotlin 可透過 evaluateJavascript 呼叫此函式重置校準
    window.egRecalibrate = function() {
      if (window._eyeTracker) window._eyeTracker.recalibrate();
    };
  </script>
</body>
</html>
